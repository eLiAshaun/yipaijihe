<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>一拍迹合 · 把收藏夹里的旅行视频，走成你的线路图</title>
  <meta name="description" content="粘贴抖音收藏的旅行视频，AI 提取景点，结合你的旅行人格，生成可编辑、可落地的逐日路线：通勤估算、预算、天气、行前清单一站搞定。">
  <meta name="theme-color" content="#f4eee1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16120e" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap">

  <!-- 首帧前确定主题，避免深浅色闪烁 -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("ypjh_theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/auth.css">
  <link rel="stylesheet" href="css/pages/persona.css">
  <link rel="stylesheet" href="css/pages/flow.css">
  <link rel="stylesheet" href="css/pages/places.css">
  <link rel="stylesheet" href="css/pages/itinerary.css">
  <link rel="stylesheet" href="css/pages/export.css">
  <link rel="stylesheet" href="css/pages/chat.css">

  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#view">跳到主要内容</a>

  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash-mark">
      <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="29" fill="#d6402a"/><path d="M14 42c8-14 16 2 24-12" fill="none" stroke="#fffaf5" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="1 7"/><path d="M44 14c-5 0-9 4-9 9 0 7 9 15 9 15s9-8 9-15c0-5-4-9-9-9z" fill="#fffaf5"/><circle cx="44" cy="23" r="3.4" fill="#d6402a"/></svg>
      <span>一拍迹合</span>
    </div>
  </div>

  <div id="app">
    <header class="topbar" id="topbar">
      <a class="brand" href="#/" aria-label="一拍迹合 首页">
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="var(--seal)"/><circle cx="32" cy="32" r="25" fill="none" stroke="#fffaf5" stroke-width="1.6" stroke-dasharray="2 3" opacity=".7"/><path d="M14 42c8-14 16 2 24-12" fill="none" stroke="#fffaf5" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="1 7"/><path d="M44 14c-5 0-9 4-9 9 0 7 9 15 9 15s9-8 9-15c0-5-4-9-9-9z" fill="#fffaf5"/><circle cx="44" cy="23" r="3.4" fill="var(--seal)"/></svg>
        <span>一拍迹合</span><small>Trip Journal</small>
      </a>
      <nav class="stepper" id="stepper" aria-label="旅行规划进度" hidden></nav>
      <div class="topbar-actions" id="topbar-actions"></div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <div id="chat-root"></div>
  <div id="modal-root"></div>
  <div id="toasts" class="toasts" role="region" aria-live="polite" aria-label="通知"></div>

  <noscript><p style="padding:24px;text-align:center">一拍迹合需要启用 JavaScript 才能运行。</p></noscript>
</body>
</html>
